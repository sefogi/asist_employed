# Proyecto aislado del stack de producción (docker-compose.yml)
name: asist_employed_dev

services:
  db:
    image: postgres:16-alpine
    container_name: asist_db_dev
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: asist
      POSTGRES_PASSWORD: asist
      POSTGRES_DB: asist
    volumes:
      - asist_db_dev:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asist -d asist"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  asist_db_dev:
